name: CHESS isolated backup and restored database acceptance
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-isolated-dr-acceptance
  cancel-in-progress: false

jobs:
  verify-restored-clone:
    runs-on: ubuntu-latest
    environment: chess-staging
    timeout-minutes: 15
    env:
      CHESS_DR_VALIDATE: ${{ vars.CHESS_DR_VALIDATE }}
      CHESS_DR_ISOLATED_RESTORE: ${{ vars.CHESS_DR_ISOLATED_RESTORE }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CHESS_DR_RESTORE_DATABASE_URL: ${{ secrets.CHESS_DR_RESTORE_DATABASE_URL }}
      CHESS_DR_RESTORE_ALLOWED_HOST: ${{ vars.CHESS_DR_RESTORE_ALLOWED_HOST }}
      CHESS_DR_REQUIRE_PG_SSL: "true"
      CHESS_DR_TEST_TENANT: ${{ vars.CHESS_DR_TEST_TENANT }}
      CHESS_DR_WITNESS_SECURITY_EVENT_ID: ${{ vars.CHESS_DR_WITNESS_SECURITY_EVENT_ID }}
      CHESS_DR_WITNESS_CONSENT_ID: ${{ vars.CHESS_DR_WITNESS_CONSENT_ID }}
      CHESS_DR_WITNESS_INVOICE_ID: ${{ vars.CHESS_DR_WITNESS_INVOICE_ID }}
      CHESS_DR_BACKUP_BUCKET: ${{ vars.CHESS_DR_BACKUP_BUCKET }}
      CHESS_DR_BACKUP_OBJECT_KEY: ${{ vars.CHESS_DR_BACKUP_OBJECT_KEY }}
      CHESS_DR_BACKUP_OBJECT_VERSION: ${{ vars.CHESS_DR_BACKUP_OBJECT_VERSION }}
      CHESS_DR_BACKUP_REGION: ${{ vars.CHESS_DR_BACKUP_REGION }}
      CHESS_DR_BACKUP_ENDPOINT: ${{ vars.CHESS_DR_BACKUP_ENDPOINT }}
      CHESS_DR_BACKUP_ALLOWED_HOST: ${{ vars.CHESS_DR_BACKUP_ALLOWED_HOST }}
      CHESS_DR_BACKUP_ACCESS_KEY_ID: ${{ secrets.CHESS_DR_BACKUP_ACCESS_KEY_ID }}
      CHESS_DR_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.CHESS_DR_BACKUP_SECRET_ACCESS_KEY }}
      CHESS_DR_MAX_BACKUP_AGE_HOURS: ${{ vars.CHESS_DR_MAX_BACKUP_AGE_HOURS }}
      CHESS_DR_DRILL_STARTED_AT: ${{ vars.CHESS_DR_DRILL_STARTED_AT }}
      CHESS_DR_RESTORE_READY_AT: ${{ vars.CHESS_DR_RESTORE_READY_AT }}
      CHESS_DR_SOURCE_LATEST_AT: ${{ vars.CHESS_DR_SOURCE_LATEST_AT }}
      CHESS_DR_RESTORED_LATEST_AT: ${{ vars.CHESS_DR_RESTORED_LATEST_AT }}
      CHESS_DR_RTO_TARGET_MINUTES: ${{ vars.CHESS_DR_RTO_TARGET_MINUTES }}
      CHESS_DR_RPO_TARGET_MINUTES: ${{ vars.CHESS_DR_RPO_TARGET_MINUTES }}
      CHESS_DR_EVIDENCE_TICKET: ${{ vars.CHESS_DR_EVIDENCE_TICKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check recovery policy and timing validators
        run: |
          node --test scripts/chess-dr-policy-check.mjs
          node --test scripts/chess-dr-evidence-check.mjs
      - name: Verify isolated pre-restored database and locked S3 backup (read-only)
        run: node scripts/chess-dr-restore-validate.mjs

# The operator must restore an independently approved fictional clone first.
# This workflow DOES NOT create backups, restore databases, alter production,
# prove source event replication completeness, or sign a release decision.
