name: CHESS AI and invoice provider sandbox contracts
on:
  workflow_dispatch:
jobs:
  verify-ai-and-invoicing-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: chess-m7-sandbox
    permissions:
      contents: read
    env:
      CHESS_M7_SANDBOX_VALIDATE: ${{ vars.CHESS_M7_SANDBOX_VALIDATE }}
      CHESS_M7_SANDBOX_ISOLATED: ${{ vars.CHESS_M7_SANDBOX_ISOLATED }}
      CHESS_M7_SANDBOX_TENANT: ${{ vars.CHESS_M7_SANDBOX_TENANT }}
      CHESS_M7_SANDBOX_BUSINESS_ID: ${{ vars.CHESS_M7_SANDBOX_BUSINESS_ID }}
      CHESS_AI_TRIAGE_API_URL: ${{ vars.CHESS_AI_TRIAGE_API_URL }}
      CHESS_AI_ALLOWED_HOST: ${{ vars.CHESS_AI_ALLOWED_HOST }}
      CHESS_AI_API_KEY: ${{ secrets.CHESS_AI_API_KEY }}
      CHESS_BILLING_DELIVERY_API_URL: ${{ vars.CHESS_BILLING_DELIVERY_API_URL }}
      CHESS_BILLING_STATUS_API_URL: ${{ vars.CHESS_BILLING_STATUS_API_URL }}
      CHESS_BILLING_ALLOWED_HOST: ${{ vars.CHESS_BILLING_ALLOWED_HOST }}
      CHESS_BILLING_API_KEY: ${{ secrets.CHESS_BILLING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify fictional AI suggestions and vendor invoice-only contract
        run: node scripts/chess-m7-sandbox-validate.mjs

# Manual/approved only. NEVER use a real client, real card or bank account.
# Ordinary PR CI does not access a live AI/billing service.
